<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Test – yakan.dev</title>
    <link rel="stylesheet" href="style.css">
    <meta name="author" content="Burak Yakan">
    <meta name="robots" content="index, follow">
    <meta name="description" content="A typing test app.">

</head>
<body>
    <header>
        <h1>Monkeytype Clone</h1>
    </header>
    <main>
        <!-- <p id="text-container"></p> -->
        

         <div class="time-select-box">
            <button class="time-buttons">5</button>
            <button class="time-buttons">15</button>
            <button class="time-buttons active">30</button>
            <button class="time-buttons">60</button>
            <button class="time-buttons">120</button>
         </div>

         <p id="congrats"></p>
         <p id="timer"></p>
         <p id="start-typing-text"><i>Start Typing to Start...</i></p>
         <div id="text-container">
            <div class="word">
                <span class="letter">B</span>
                <span class="letter">u</span>
                <span class="letter">&nbsp;</span>
            </div>
            <div class="word">
                <span class="letter">b</span>
                <span class="letter">i</span>
                <span class="letter">r</span>
                <span class="letter">&nbsp;</span>
            </div>
            <div class="word">
                <span class="letter">t</span>
                <span class="letter">e</span>
                <span class="letter">s</span>
                <span class="letter">t</span>
                <span class="letter">&nbsp;</span>
            </div>
            <div class="word">
                <span class="letter">m</span>
                <span class="letter">e</span>
                <span class="letter">t</span>
                <span class="letter">n</span>
                <span class="letter">i</span>
                <span class="letter">d</span>
                <span class="letter">i</span>
                <span class="letter">r</span>
                <span class="letter">.</span>
            </div>
         </div>
         
        <input type="text" id="hidden-text-input" autofocus autocomplete="off">
        <p id="end-text"></p>
        <p id="finish-time-text"></p>
        <p id="scoreboard"></p>
        <button id="restart-button">Restart Test</button>

    </main>
    <footer>

    </footer>
    


    <script src="script.js"></script>
</body>
</html>
