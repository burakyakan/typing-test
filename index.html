<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Test – yakan.dev</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="style.css">
    <meta name="author" content="Burak Yakan">
    <meta name="robots" content="index, follow">
    <meta name="description" content="A typing test app.">

    <script src="https://cdn.jsdelivr.net/npm/@hiseb/confetti@2.2.0/dist/confetti.min.js"></script>
    <script>
        confetti();
    </script>
</head>
<body>
    <header>
        <h1>GorillaType</h1>
    </header>
    <main>
        <hr>
        <p>Select Time</p>
        <div class="time-select-box">
            <button class="time-buttons">5</button>
            <button class="time-buttons">15</button>
            <button class="time-buttons">30</button>
            <button class="time-buttons">60</button>
            <button class="time-buttons">120</button>
            
        </div>

        <div class="text-type-select-box">
            <button class="text-type-buttons">Quotes</button>
            <button class="text-type-buttons">Random Words</button>
        </div>

        
        <p id="timer"></p>
        <p id="start-typing-text"><i>Start Typing to Begin...</i></p>
         
        <div id="text-container"></div>
         
        <input type="text" id="hidden-text-input" autofocus autocomplete="off">

        <dialog id="end-result-box">
            <h2>Scoreboard</h2>
            <hr>
            <p id="congrats"></p>
            <p id="time-is-up-text"></p>
            <p id="end-text"></p>
            <p id="finish-time-text"></p>
            <p id="net-wpm-text"></p>
            <p id="raw-wpm-text"></p>
            <p id="scoreboard"></p>
            <button id="restart-button">Play Again</button>
        </dialog>

        
        <button id="restart-button">Restart Test</button>

    </main>
    <footer>
        <p>Burak Yakan © 2026 – <a href="https://yakan.dev" target="_blank">yakan.dev</a></p>
        <p><a href="https://github.com/burakyakan/typing-test">Source Code</a></p>
    </footer>
    
    <script src="script.js"></script>
    

</body>
</html>
